# Self-hosted stack — everything the factory needs, on one cheap VPS.
# `docker compose up -d` gives you Postgres, Redis, MinIO and n8n.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    command: ["redis-server", "--appendonly", "yes"]

  # S3-compatible object storage for reusable assets (swap for Cloudflare R2 later)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  # Visual orchestration / scheduling / glue (calls the factory's HTTP/CLI)
  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"
    volumes: ["n8ndata:/home/node/.n8n"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  n8ndata:
